<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Golden Fork - Forgot Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      rel="icon"
      href="https://tse4.mm.bing.net/th/id/OIP.nBh3UOUuYtFfOTH9vnKY4QHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-[#0F0F0F] text-white min-h-screen flex items-center justify-center px-6"
  >
    <div
      class="w-full max-w-md bg-[#1A1A1A] border border-[#D4AF37]/20 rounded-3xl p-10 shadow-2xl"
    >
      <!-- Logo -->

      <div class="text-center mb-8">
        <i class="fa-solid fa-key text-6xl text-[#D4AF37] mb-4"></i>

        <h1 class="text-4xl font-bold text-[#D4AF37]">Forgot Password</h1>

        <p class="text-gray-400 mt-3">Reset your account password</p>
      </div>

      <!-- Email -->

      <input
        id="email"
        type="email"
        placeholder="Enter Your Email"
        class="w-full p-4 rounded-xl bg-[#0F0F0F] border border-[#D4AF37]/20 outline-none focus:border-[#D4AF37] mb-4"
      />

      <button
        onclick="sendCode()"
        class="w-full bg-[#D4AF37] text-black py-4 rounded-xl font-bold hover:scale-105 transition-all duration-300"
      >
        Send Verification Code
      </button>

      <!-- Code Section -->

      <div id="code-section" class="hidden mt-8">
        <div
          class="bg-[#0F0F0F] border border-[#D4AF37]/20 rounded-xl p-4 text-center mb-4"
        >
          <p class="text-gray-400">Verification Code</p>

          <span
            id="generated-code"
            class="text-3xl font-bold text-[#D4AF37]"
          ></span>
        </div>

        <input
          id="user-code"
          type="text"
          placeholder="Enter Verification Code"
          class="w-full p-4 rounded-xl bg-[#0F0F0F] border border-[#D4AF37]/20 outline-none focus:border-[#D4AF37]"
        />

        <button
          onclick="verifyCode()"
          class="w-full bg-green-500 py-4 rounded-xl font-bold mt-4 hover:scale-105 transition-all duration-300"
        >
          Verify Code
        </button>
      </div>

      <!-- Reset Password -->

      <div id="reset-section" class="hidden mt-8">
        <input
          id="new-password"
          type="password"
          placeholder="New Password"
          class="w-full p-4 rounded-xl bg-[#0F0F0F] border border-[#D4AF37]/20 outline-none focus:border-[#D4AF37]"
        />

        <button
          onclick="resetPassword()"
          class="w-full bg-[#D4AF37] text-black py-4 rounded-xl font-bold mt-4 hover:scale-105 transition-all duration-300"
        >
          Reset Password
        </button>
      </div>

      <!-- Login Link -->

      <div class="text-center mt-8">
        <a href="login.html" class="text-[#D4AF37] hover:text-[#F4D03F]">
          Back To Login
        </a>
      </div>
    </div>

    <script src="forgot-password.js"></script>
  </body>
</html>
